[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-audio-notes"
version = "0.3.1"
description = "Desktop workspace for evidence-grounded audio and document notes"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2,<2",
  "av>=14,<17",
  "pypdfium2>=4,<6",
  "Pillow>=10,<13",
  "sentence-transformers>=3,<7",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
van = "visual_audio_notes.cli:main"
van-workflow = "visual_audio_notes.workflow_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
